name: Update recent blog posts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blog-posts.yml"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update latest posts in README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://1421582341.github.io/learn-note/rss.xml"
          max_post_count: 5
          date_format: "yyyy-mm-dd"
          template: "$newline- [$title]($url) — $date"
          item_exec: 'post.url = post.url.replace("https://1421582341.github.io/blog/", "https://1421582341.github.io/learn-note/blog/")'
          commit_message: "Update recent blog posts"
